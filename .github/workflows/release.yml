name: release
on:
  push:
    branches:
      - main
  release:
    types: [published]
permissions:
  id-token: write
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      - name: Set version 📄
        id: version
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "dist-tag=latest" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0-dev.$(date -u +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT
            echo "dist-tag=dev" >> $GITHUB_OUTPUT
          fi

  publish-npm:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 📦
        uses: actions/setup-node@v4
        with:
          node-version: 24
          scope: "@sdkgen"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies 🔧
        run: npm ci --include=dev

      - name: Build code 🚚
        run: |
          npm run build
          sed -i -E 's_(<base href=")/(">)_\1/playground/\2_' packages/playground/dist/index.html

      - name: Publish NPM packages 🚀
        run: |
          cp -r LICENSE packages/*
          npx lerna publish ${{ needs.prepare.outputs.version }} --no-git-tag-version --no-push --yes --dist-tag=${{ needs.prepare.outputs.dist-tag }} --throttle --throttle-size=1 --throttle-delay=5

  publish-dotnet:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup .NET 🎯
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pack .NET package 🚚
        run: dotnet pack -c:Release -p:PackageVersion=${{ needs.prepare.outputs.version }}
        working-directory: ./packages/dotnet-runtime/runtime

      - name: Login to NuGet.org 🗝️
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish .NET package 🚀
        run: dotnet nuget push bin/**/*.nupkg --api-key ${{steps.nuget-login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
        working-directory: ./packages/dotnet-runtime/runtime

  publish-android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Java ☕
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Prepare Android package 🧪
        run: |
          sed -i -e "s/versionName \"1.0\"/versionName \"${{ needs.prepare.outputs.version }}\"/g" runtime/build.gradle
          sed -i -e "s/versionCode 1/versionCode $(date +%s)/g" runtime/build.gradle
          sed -i -e "s/PUBLISH_VERSION = '0.0.0'/PUBLISH_VERSION = '${{ needs.prepare.outputs.version }}'/g" runtime/build.gradle
          sed -i -e "s/version = \"0.0.0\"/version = \"${{ needs.prepare.outputs.version }}\"/g" build.gradle
          echo "SONATYPE_NEXUS_USERNAME=${{ secrets.NEXUS_MAVEN_USER }}" >> local.properties
          echo "SONATYPE_NEXUS_PASSWORD=${{ secrets.NEXUS_MAVEN_PASSWORD }}" >> local.properties
          echo "signing.keyId=${{ secrets.MAVEN_GPG_KEY_ID }}" >> local.properties
          echo "signing.password=${{ secrets.MAVEN_GPG_KEY_PASSWORD }}" >> local.properties
          echo "signing.secretKeyRingFile=${{ secrets.MAVEN_GPG_KEY_FILE_PATH }}" >> local.properties
          echo "${{ secrets.MAVEN_GPG_FILE_CONTENT }}" | base64 -d > runtime/"${{ secrets.MAVEN_GPG_KEY_FILE_PATH }}"
        working-directory: ./packages/android-runtime

      - name: Check Gradle Wrapper 👀
        uses: gradle/actions/wrapper-validation@v6

      - name: Publish Android package 🚀
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository
        working-directory: ./packages/android-runtime

  publish-dart:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Flutter 🦋
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.19.x
          channel: stable

      - name: Download pub dependencies 📦
        run: flutter pub get
        working-directory: ./packages/dart-runtime

      - name: Prepare Dart package 🧪
        run: |
          sed 's/version: 0.0.0/version: ${{ needs.prepare.outputs.version }}/' -i pubspec.yaml
        working-directory: ./packages/dart-runtime

      - name: Authenticate with GCP ☁️
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.DART_PUB_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.DART_PUB_GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: id_token
          id_token_audience: https://pub.dev
          id_token_include_email: true

      - name: Publish Dart package 🚀
        run: |
          echo "${{ steps.auth.outputs.id_token }}" | flutter pub token add https://pub.dev
          flutter pub pub publish -v -f
        working-directory: ./packages/dart-runtime
